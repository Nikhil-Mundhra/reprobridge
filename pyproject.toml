[project]
name = "reprobridge"
version = "0.3.0"
description = "Continuous, Evidence-Verified Reproductive & Preventive Care Coordination"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "langgraph>=0.2.60",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.9.0",
    "ty>=0.0.1a0",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["."]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (mutable defaults, bare excepts, etc.)
    "UP",  # pyupgrade (modern syntax: X | None, list[str])
    "SIM", # flake8-simplify
    "PTH", # flake8-use-pathlib (forbids os.path)
    "T20", # flake8-print (forbids print() in application code)
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]

[tool.ty.environment]
python-version = "3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
