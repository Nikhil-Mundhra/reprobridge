[project]
name = "reprobridge"
version = "0.3.0"
description = "Continuous, Evidence-Verified Reproductive & Preventive Care Coordination"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.3",
    "langgraph>=0.2.60",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.34.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
